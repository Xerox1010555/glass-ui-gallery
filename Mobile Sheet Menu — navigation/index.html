<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Sheet Menu - الأقسام</title>
<style>
  :root{--bg:#121620;--panel:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.14);--accent:#7dd3fc;--secondary:#34d399;--text:#f8fafc;--dim:#cbd5e1}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;direction:rtl;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 20% 30%,rgba(125,211,252,0.10)0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(52,211,153,0.09)0%,transparent 40%);background-size:200% 200%;animation:bgm 14s ease infinite;overflow:hidden}
  @keyframes bgm{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
  header{position:relative;z-index:10;padding:30px 20px 10px;text-align:center}
  header h1{font-size:2rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff 0%,var(--accent) 50%,var(--secondary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header p{color:var(--dim);font-size:0.95rem;margin-top:4px}
  .container{position:relative;z-index:10;max-width:900px;margin:0 auto;padding:20px 20px 110px}
  .card{background:var(--panel);backdrop-filter:blur(20px)saturate(200%);-webkit-backdrop-filter:blur(20px)saturate(200%);border:1px solid var(--border);border-radius:24px;padding:32px 24px;box-shadow:0 24px 48px rgba(0,0,0,0.45)}
  .back{display:inline-block;margin-top:24px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);font-size:0.95rem;padding-bottom:2px;transition:0.2s}
  .back:hover{color:#fff;border-color:#fff}
</style>
</head>
<body>
  <div class="bg"></div>
  <header><h1>Mobile Sheet Menu</h1><p>مكون من مشروع الأقسام</p></header>
  <div class="container">
    <div class="card" style="text-align:center">
      <div style="font-size:3rem;margin-bottom:16px">📱</div>
      <h2 style="font-size:1.6rem;margin-bottom:12px">قائمة الهاتف المنسدلة</h2>
      <p style="color:var(--dim);margin-bottom:20px">قائمة منسدلة من أسفل الشاشة للهواتف</p>
      <button id="openSheet" style="background:var(--accent);color:#0b1120;border:none;padding:12px 26px;border-radius:14px;font-weight:800;cursor:pointer;box-shadow:0 0 20px rgba(125,211,252,0.4)">فتح القائمة</button>
      <div id="sheet" style="position:fixed;bottom:-100%;left:0;right:0;height:60vh;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:24px;transition:bottom 0.4s ease;z-index:50;display:flex;flex-direction:column;gap:14px;align-items:center">
        <div style="width:40px;height:4px;background:#334155;border-radius:2px;margin-bottom:10px"></div>
        <div style="font-weight:800;font-size:1.1rem;color:#fff">القائمة السريعة</div>
        <a href="#" style="color:var(--dim);text-decoration:none;font-size:1rem;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);width:100%;text-align:right">الرئيسية</a>
        <a href="#" style="color:var(--dim);text-decoration:none;font-size:1rem;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);width:100%;text-align:right">الأقسام</a>
        <a href="#" style="color:var(--dim);text-decoration:none;font-size:1rem;padding:10px 0;width:100%;text-align:right">الإعدادات</a>
        <button id="closeSheet" style="background:transparent;color:var(--accent);border:1px solid var(--accent);padding:10px 22px;border-radius:12px;font-weight:800;cursor:pointer">إغلاق</button>
      </div>
    </div>
    <a href="../index.html" class="back">العودة للواجهة الرئيسية</a>
  </div>
  <script>
    var openBtn=document.getElementById('openSheet');
    var closeBtn=document.getElementById('closeSheet');
    var sheet=document.getElementById('sheet');
    openBtn.onclick=function(){sheet.style.bottom='0'};
    closeBtn.onclick=function(){sheet.style.bottom='-100%'};
  </script>
</body>
</html>
