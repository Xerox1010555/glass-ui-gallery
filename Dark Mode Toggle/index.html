<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode Toggle - الأقسام</title>
<style>
  :root{--bg:#121620;--panel:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.14);--accent:#7dd3fc;--secondary:#34d399;--text:#f8fafc;--dim:#cbd5e1}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;direction:rtl;overflow-x:hidden;transition:background 0.4s,color 0.4s}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 20% 30%,rgba(125,211,252,0.10)0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(52,211,153,0.09)0%,transparent 40%);background-size:200% 200%;animation:bgm 14s ease infinite;overflow:hidden}
  @keyframes bgm{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
  header{position:relative;z-index:10;padding:30px 20px 10px;text-align:center}
  header h1{font-size:2rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff 0%,var(--accent) 50%,var(--secondary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header p{color:var(--dim);font-size:0.95rem;margin-top:4px}
  .container{position:relative;z-index:10;max-width:900px;margin:0 auto;padding:20px 20px 110px}
  .card{background:var(--panel);backdrop-filter:blur(20px)saturate(200%);-webkit-backdrop-filter:blur(20px)saturate(200%);border:1px solid var(--border);border-radius:24px;padding:32px 24px;box-shadow:0 24px 48px rgba(0,0,0,0.45)}
  .back{display:inline-block;margin-top:24px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);font-size:0.95rem;padding-bottom:2px;transition:0.2s}
  .back:hover{color:#fff;border-color:#fff}
</style>
</head>
<body>
  <div class="bg"></div>
  <header><h1>Dark Mode Toggle</h1><p>مكون من مشروع الأقسام</p></header>
  <div class="container">
    <div class="card" style="text-align:center">
      <div style="font-size:3rem;margin-bottom:16px">🌙</div>
      <h2 style="font-size:1.6rem;margin-bottom:12px">زر تبديل الوضع الليلي والنهاري</h2>
      <p style="color:var(--dim);margin-bottom:24px">اضغط على الزر للتبديل بين الأوضاع</p>
      <label style="position:relative;display:inline-block;width:64px;height:34px">
        <input type="checkbox" id="tg" style="opacity:0;width:0;height:0">
        <span style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#334155;transition:0.4s;border-radius:34px"></span>
        <span style="position:absolute;left:4px;bottom:4px;width:26px;height:26px;background:#fff;transition:0.4s;border-radius:50%" id="knob"></span>
      </label>
      <div id="st" style="margin-top:16px;font-size:1rem;color:var(--dim)">الوضع الحالي: داكن</div>
    </div>
    <a href="../index.html" class="back">العودة للواجهة الرئيسية</a>
  </div>
  <script>
    var tg=document.getElementById('tg');
    var knob=document.getElementById('knob');
    var st=document.getElementById('st');
    tg.checked=false;
    tg.onchange=function(){
      if(tg.checked){
        document.body.style.background='#f8fafc';document.body.style.color='#0f172a';
        knob.style.transform='translateX(30px)';st.textContent='الوضع الحالي: نهار';st.style.color='#0f172a';
      }else{
        document.body.style.background='#121620';document.body.style.color='#f8fafc';
        knob.style.transform='translateX(0)';st.textContent='الوضع الحالي: ليل';st.style.color='var(--dim)';
      }
    };
  </script>
</body>
</html>
