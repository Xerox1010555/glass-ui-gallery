<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer - الأقسام</title>
<style>
  :root{--bg:#121620;--panel:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.14);--accent:#7dd3fc;--secondary:#34d399;--text:#f8fafc;--dim:#cbd5e1}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;direction:rtl;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 20% 30%,rgba(125,211,252,0.10)0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(52,211,153,0.09)0%,transparent 40%);background-size:200% 200%;animation:bgm 14s ease infinite;overflow:hidden}
  @keyframes bgm{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
  header{position:relative;z-index:10;padding:30px 20px 10px;text-align:center}
  header h1{font-size:2rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff 0%,var(--accent) 50%,var(--secondary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header p{color:var(--dim);font-size:0.95rem;margin-top:4px}
  .container{position:relative;z-index:10;max-width:900px;margin:0 auto;padding:20px 20px 110px}
  .card{background:var(--panel);backdrop-filter:blur(20px)saturate(200%);-webkit-backdrop-filter:blur(20px)saturate(200%);border:1px solid var(--border);border-radius:24px;padding:32px 24px;box-shadow:0 24px 48px rgba(0,0,0,0.45)}
  .back{display:inline-block;margin-top:24px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);font-size:0.95rem;padding-bottom:2px;transition:0.2s}
  .back:hover{color:#fff;border-color:#fff}
</style>
</head>
<body>
  <div class="bg"></div>
  <header><h1>Countdown Timer</h1><p>مكون من مشروع الأقسام</p></header>
  <div class="container">
    <div class="card" style="text-align:center">
      <div style="font-size:3rem;margin-bottom:16px">⏱️</div>
      <h2 style="font-size:1.6rem;margin-bottom:16px">مؤقت تنازلي للأحداث</h2>
      <div id="timer" style="display:flex;gap:14px;justify-content:center;margin-bottom:20px"></div>
      <p id="label" style="color:var(--dim);font-size:0.95rem">ينتظر الحدث التالي...</p>
    </div>
    <a href="../index.html" class="back">العودة للواجهة الرئيسية</a>
  </div>
  <script>
    var target=new Date();target.setDate(target.getDate()+7);
    var boxes=['days','hours','mins','secs'];
    boxes.forEach(function(id){
      var wrap=document.createElement('div');
      wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems='center';
      var v=document.createElement('div');v.id=id;v.style.fontSize='1.9rem';v.style.fontWeight='900';v.style.color='var(--accent)';
      var l=document.createElement('div');l.style.fontSize='0.75rem';l.style.color='var(--dim)';
      l.textContent=id==='days'?'أيام':id==='hours'?'ساعات':id==='mins'?'دقائق':'ثواني';
      wrap.appendChild(v);wrap.appendChild(l);document.getElementById('timer').appendChild(wrap);
    });
    function tick(){
      var now=new Date();
      var diff=target-now;
      if(diff<=0){document.getElementById('label').textContent='انتهى الوقت!';return;}
      var d=Math.floor(diff/(1000*60*60*24));
      var h=Math.floor(diff%(1000*60*60*24)/(1000*60*60));
      var m=Math.floor(diff%(1000*60*60)/(1000*60));
      var s=Math.floor(diff%(1000*60)/1000);
      document.getElementById('days').textContent=d;
      document.getElementById('hours').textContent=h;
      document.getElementById('mins').textContent=m;
      document.getElementById('secs').textContent=s;
    }
    setInterval(tick,1000);tick();
  </script>
</body>
</html>
